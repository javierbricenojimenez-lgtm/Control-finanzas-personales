[theme]
base = "light"
primaryColor = "#087F70"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
borderColor = "#DFE7EF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["36px", "28px", "21px", "18px", "16px", "14px"]
chartCategoricalColors = ["#087F70", "#4477BB", "#E9AB54", "#8A71BE", "#E58080", "#75B6B0"]
[theme.sidebar]
backgroundColor = "#142D3B"
secondaryBackgroundColor = "#214252"
textColor = "#F2F7FA"
primaryColor = "#65D6B3"
borderColor = "#31505F"
